<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8"/>
    <style>
        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100px;
            background: rgb(3, 57, 75);
        }
        .flex-container div {
            width: 100px;
            height: 50px;
            background:rgb(226, 5, 71);
            color:rgba(22, 22,19,0.726);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        
    </style>
</head>
<body>
    <h2>flexbox layout</h2>
    <div class="flex-container">
        <div>home</div>
        <div>contact</div>
        <div>help</div>
    </div>
</body>
</html>
